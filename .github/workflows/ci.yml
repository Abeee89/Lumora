name: CI

# DEPLOYMENT-ARCHITECTURE.md section 4: stages 1, 2, 3, 4 and 7.
# Stage 5 (E2E against a preview deployment) needs the U-A1 platform and arrives with
# the first product page. Stage 8 (staging deploy) needs U-A1 as well; neither is stubbed here.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Stage 1-3 typecheck, lint, boundaries, unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Stage 1 typecheck
        run: npm run typecheck
      - name: Stage 2 lint
        run: npm run lint
      - name: Stage 2 boundaries
        run: npm run boundaries
      - name: Stage 3 unit tests
        run: npm run test

  integration:
    name: Stage 4 integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: lumora
          POSTGRES_PASSWORD: lumora
          POSTGRES_DB: lumora_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lumora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://lumora:lumora@localhost:5432/lumora_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  image:
    name: Stage 7 build the single image
    runs-on: ubuntu-latest
    needs: [verify, integration]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build web and worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: lumora:${{ github.sha }}